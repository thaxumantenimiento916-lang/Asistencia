<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asistencia y Planificación Semanal</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
</head>
<body>

<!-- ===== LOGIN ===== -->
<div id="loginScreen" class="login-screen">
  <div class="login-box">
    <h1>🗓️ Control de Personal</h1>
    <p class="muted">Acceso restringido — solo el responsable de planta</p>
    <input type="password" id="loginPassword" placeholder="Contraseña" />
    <button onclick="login()">Ingresar</button>
    <p id="loginError" class="error"></p>
  </div>
</div>

<!-- ===== APP ===== -->
<div id="app" class="app hidden">
  <header class="topbar">
    <h1>🗓️ Asistencia &amp; Planificación Semanal</h1>
    <button class="btn-ghost" onclick="logout()">Salir</button>
  </header>

  <nav class="tabs">
    <button class="tab-btn active" data-tab="horario" onclick="showTab('horario')">Horario Semanal</button>
    <button class="tab-btn" data-tab="asistencia" onclick="showTab('asistencia')">Asistencia</button>
    <button class="tab-btn" data-tab="personal" onclick="showTab('personal')">Personal</button>
    <button class="tab-btn" data-tab="reportes" onclick="showTab('reportes')">Reportes</button>
  </nav>

  <!-- TAB: HORARIO -->
  <section id="tab-horario" class="tab-content">
    <div class="toolbar">
      <label>Semana (lunes de inicio):
        <input type="date" id="semanaInput" onchange="cargarHorario()">
      </label>
      <button onclick="generarHorario()">⚙️ Generar propuesta automática</button>
      <button class="btn-primary" onclick="guardarHorario()">💾 Guardar cambios</button>
    </div>
    <div class="table-wrap">
      <table id="tablaHorario">
        <thead>
          <tr>
            <th>Personal</th><th>Tipo</th>
            <th>Lun</th><th>Mar</th><th>Mié</th><th>Jue</th><th>Vie</th><th>Sáb</th><th>Dom</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </section>

  <!-- TAB: ASISTENCIA -->
  <section id="tab-asistencia" class="tab-content hidden">
    <div class="toolbar">
      <label>Fecha:
        <input type="date" id="fechaAsistencia" onchange="cargarAsistencia()">
      </label>
    </div>
    <div class="table-wrap">
      <table id="tablaAsistencia">
        <thead>
          <tr><th>Personal</th><th>Tipo</th><th>Turno asignado</th><th>Estado</th><th>Ingreso</th><th>Salida</th><th>Marcar</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </section>

  <!-- TAB: PERSONAL -->
  <section id="tab-personal" class="tab-content hidden">
    <div class="toolbar">
      <button class="btn-primary" onclick="abrirFormPersonal()">➕ Agregar personal</button>
    </div>
    <div id="formPersonal" class="form-box hidden">
      <input type="hidden" id="pId">
      <input type="text" id="pNombre" placeholder="Nombre completo">
      <select id="pTipo">
        <option value="Fijo">Fijo</option>
        <option value="Practicante">Practicante</option>
        <option value="Rotativo">Rotativo</option>
      </select>
      <input type="text" id="pArea" placeholder="Área">
      <select id="pEstado">
        <option value="Activo">Activo</option>
        <option value="Inactivo">Inactivo</option>
      </select>
      <button class="btn-primary" onclick="guardarPersonal()">Guardar</button>
      <button class="btn-ghost" onclick="cerrarFormPersonal()">Cancelar</button>
    </div>
    <div class="table-wrap">
      <table id="tablaPersonal">
        <thead><tr><th>Nombre</th><th>Tipo</th><th>Área</th><th>Estado</th><th></th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </section>

  <!-- TAB: REPORTES -->
  <section id="tab-reportes" class="tab-content hidden">
    <div class="toolbar">
      <label>Fecha del reporte:
        <input type="date" id="fechaReporte">
      </label>
      <button onclick="exportarCSV()">⬇️ Exportar CSV</button>
      <button onclick="exportarPDF()">⬇️ Exportar PDF</button>
    </div>
    <p class="muted">El reporte toma la asistencia marcada en la fecha seleccionada.</p>
  </section>

  <div id="toast" class="toast hidden"></div>
</div>

<script src="js/app.js"></script>
</body>
</html>
