<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asistencia y Planificación Semanal</title>
<style>
:root {
  --bg: #f4f6f9;
  --card: #ffffff;
  --primary: #2b6cb0;
  --primary-dark: #1a4971;
  --text: #1a202c;
  --muted: #718096;
  --border: #e2e8f0;
  --danger: #e53e3e;
  --success: #38a169;
  --warning: #dd6b20;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
}

.hidden { display: none !important; }

/* Login */
.login-screen {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, #2b6cb0, #1a4971);
}
.login-box {
  background: var(--card);
  padding: 40px;
  border-radius: 12px;
  box-shadow: 0 10px 30px rgba(0,0,0,.2);
  width: 320px;
  text-align: center;
}
.login-box h1 { font-size: 1.3rem; margin-bottom: 4px; }
.login-box input {
  width: 100%;
  padding: 10px;
  margin: 16px 0 8px;
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 1rem;
}
.login-box button {
  width: 100%;
  padding: 10px;
  background: var(--primary);
  color: white;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-size: 1rem;
}
.login-box button:hover { background: var(--primary-dark); }
.error { color: var(--danger); font-size: .85rem; min-height: 1em; }
.muted { color: var(--muted); font-size: .85rem; }

/* App shell */
.topbar {
  background: var(--card);
  padding: 16px 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--border);
}
.topbar h1 { font-size: 1.1rem; margin: 0; }

.tabs {
  display: flex;
  gap: 4px;
  padding: 12px 24px 0;
  background: var(--card);
  border-bottom: 1px solid var(--border);
}
.tab-btn {
  padding: 10px 16px;
  border: none;
  background: transparent;
  cursor: pointer;
  font-size: .95rem;
  color: var(--muted);
  border-bottom: 2px solid transparent;
}
.tab-btn.active { color: var(--primary); border-color: var(--primary); font-weight: 600; }

.tab-content { padding: 24px; max-width: 1100px; margin: 0 auto; }

.toolbar {
  display: flex;
  gap: 12px;
  align-items: center;
  flex-wrap: wrap;
  margin-bottom: 16px;
  background: var(--card);
  padding: 14px 16px;
  border-radius: 10px;
  border: 1px solid var(--border);
}
.toolbar label { font-size: .9rem; color: var(--muted); }
.toolbar input { padding: 7px 10px; border: 1px solid var(--border); border-radius: 6px; }

button {
  padding: 8px 14px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: white;
  cursor: pointer;
  font-size: .9rem;
}
button:hover { background: #f0f4f8; }
.btn-primary { background: var(--primary); color: white; border-color: var(--primary); }
.btn-primary:hover { background: var(--primary-dark); }
.btn-ghost { background: transparent; border-color: transparent; color: var(--muted); }

.table-wrap {
  background: var(--card);
  border-radius: 10px;
  border: 1px solid var(--border);
  overflow-x: auto;
}
table { width: 100%; border-collapse: collapse; font-size: .9rem; }
th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap; }
th { background: #f8fafc; color: var(--muted); font-weight: 600; }

select.turno-select { padding: 5px 6px; border-radius: 6px; border: 1px solid var(--border); font-weight: 600; }
select.turno-select[data-turno="Dia"] { background: #3182ce; color: #ffffff; border-color: #2c5282; }
select.turno-select[data-turno="Noche"] { background: #1a202c; color: #ffffff; border-color: #000000; }
select.turno-select[data-turno="Descanso"] { background: #f6ad55; color: #7b341e; border-color: #dd6b20; }

.badge { padding: 3px 10px; border-radius: 999px; font-size: .78rem; font-weight: 600; }
.badge-presente { background: #c6f6d5; color: #22543d; }
.badge-ausente { background: #fed7d7; color: #822727; }
.badge-sin-marcar { background: #edf2f7; color: var(--muted); }

.estado-marcar { display: flex; gap: 6px; }
.estado-btn {
  padding: 6px 12px;
  font-size: .82rem;
  font-weight: 600;
  border-radius: 999px;
  background: transparent;
  transition: background .15s, color .15s;
}
.estado-presente { border-color: var(--success); color: var(--success); }
.estado-presente.active { background: var(--success); color: #ffffff; }
.estado-ausente { border-color: var(--danger); color: var(--danger); }
.estado-ausente.active { background: var(--danger); color: #ffffff; }

.hora-select { padding: 4px 6px; border-radius: 6px; border: 1px solid var(--border); font-size: .82rem; }
.hora-custom { width: 78px; padding: 3px 5px; border-radius: 6px; border: 1px solid var(--border); font-size: .82rem; margin-top: 4px; }

.form-box {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 16px;
  margin-bottom: 16px;
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}
.form-box input, .form-box select { padding: 8px; border: 1px solid var(--border); border-radius: 6px; }

.toast {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: var(--text);
  color: white;
  padding: 12px 18px;
  border-radius: 8px;
  font-size: .9rem;
  box-shadow: 0 6px 20px rgba(0,0,0,.2);
}

</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
</head>
<body>

<!-- ===== LOGIN ===== -->
<div id="loginScreen" class="login-screen">
  <div class="login-box">
    <h1>🗓️ Control de Personal</h1>
    <p class="muted">Acceso restringido — solo el responsable de planta</p>
    <input type="password" id="loginPassword" placeholder="Contraseña" />
    <button onclick="login()">Ingresar</button>
    <p id="loginError" class="error"></p>
  </div>
</div>

<!-- ===== APP ===== -->
<div id="app" class="app hidden">
  <header class="topbar">
    <h1>🗓️ Asistencia &amp; Planificación Semanal</h1>
    <button class="btn-ghost" onclick="logout()">Salir</button>
  </header>

  <nav class="tabs">
    <button class="tab-btn active" data-tab="horario" onclick="showTab('horario')">Horario Semanal</button>
    <button class="tab-btn" data-tab="asistencia" onclick="showTab('asistencia')">Asistencia</button>
    <button class="tab-btn" data-tab="personal" onclick="showTab('personal')">Personal</button>
    <button class="tab-btn" data-tab="reportes" onclick="showTab('reportes')">Reportes</button>
  </nav>

  <!-- TAB: HORARIO -->
  <section id="tab-horario" class="tab-content">
    <div class="toolbar">
      <label>Semana (lunes de inicio):
        <input type="date" id="semanaInput" onchange="cargarHorario()">
      </label>
      <button onclick="generarHorario()">⚙️ Generar propuesta automática</button>
      <button class="btn-primary" onclick="guardarHorario()">💾 Guardar cambios</button>
    </div>
    <div class="table-wrap">
      <table id="tablaHorario">
        <thead>
          <tr>
            <th>Personal</th><th>Tipo</th>
            <th>Lun</th><th>Mar</th><th>Mié</th><th>Jue</th><th>Vie</th><th>Sáb</th><th>Dom</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </section>

  <!-- TAB: ASISTENCIA -->
  <section id="tab-asistencia" class="tab-content hidden">
    <div class="toolbar">
      <label>Fecha:
        <input type="date" id="fechaAsistencia" onchange="cargarAsistencia()">
      </label>
    </div>
    <div class="table-wrap">
      <table id="tablaAsistencia">
        <thead>
          <tr><th>Personal</th><th>Tipo</th><th>Turno asignado</th><th>Ingreso</th><th>Salida</th><th>Estado</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </section>

  <!-- TAB: PERSONAL -->
  <section id="tab-personal" class="tab-content hidden">
    <div class="toolbar">
      <button class="btn-primary" onclick="abrirFormPersonal()">➕ Agregar personal</button>
    </div>
    <div id="formPersonal" class="form-box hidden">
      <input type="hidden" id="pId">
      <input type="text" id="pNombre" placeholder="Nombre completo">
      <select id="pTipo">
        <option value="Fijo">Fijo</option>
        <option value="Practicante">Practicante</option>
        <option value="Rotativo">Rotativo</option>
      </select>
      <input type="text" id="pArea" placeholder="Área">
      <select id="pEstado">
        <option value="Activo">Activo</option>
        <option value="Inactivo">Inactivo</option>
      </select>
      <button class="btn-primary" onclick="guardarPersonal()">Guardar</button>
      <button class="btn-ghost" onclick="cerrarFormPersonal()">Cancelar</button>
    </div>
    <div class="table-wrap">
      <table id="tablaPersonal">
        <thead><tr><th>Nombre</th><th>Tipo</th><th>Área</th><th>Estado</th><th></th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </section>

  <!-- TAB: REPORTES -->
  <section id="tab-reportes" class="tab-content hidden">
    <div class="toolbar">
      <label>Fecha del reporte:
        <input type="date" id="fechaReporte">
      </label>
      <button onclick="exportarCSV()">⬇️ Exportar CSV</button>
      <button onclick="exportarPDF()">⬇️ Exportar PDF</button>
    </div>
    <p class="muted">El reporte toma la asistencia marcada en la fecha seleccionada.</p>
  </section>

  <div id="toast" class="toast hidden"></div>
</div>

<script>
// ============================================================
// CONFIGURACIÓN — pega aquí la URL de tu Apps Script Web App
// ============================================================
const API_URL = 'https://script.google.com/macros/s/AKfycbxWagzjz7ZtDyP8u2FC7MKcTHRMHqtJCAkfW4kzVgOueEYm95z6uA28553v7z3pjTA5/exec';

const DIAS = ['Lunes', 'Martes', 'Miercoles', 'Jueves', 'Viernes', 'Sabado', 'Domingo'];
const DIAS_CORTO = { Lunes: 'Lun', Martes: 'Mar', Miercoles: 'Mié', Jueves: 'Jue', Viernes: 'Vie', Sabado: 'Sáb', Domingo: 'Dom' };

let TOKEN = localStorage.getItem('token') || null;
let personalCache = [];
let horarioCache = [];
let asistenciaCache = [];
let MINUTOS_ALMUERZO = 60; // valor por defecto; se actualiza desde Config al iniciar sesión

function calcularHorasTrabajadas(horaIngreso, horaSalida) {
  if (!horaIngreso || !horaSalida) return '';
  const [h1, m1] = horaIngreso.split(':').map(Number);
  const [h2, m2] = horaSalida.split(':').map(Number);
  if (isNaN(h1) || isNaN(h2)) return '';
  let minutos = (h2 * 60 + m2) - (h1 * 60 + m1) - MINUTOS_ALMUERZO;
  if (minutos < 0) minutos += 24 * 60;
  const horas = Math.floor(minutos / 60);
  const mins = minutos % 60;
  return `${horas}h ${mins}m`;
}

// ============================================================
// API helper — usa text/plain para evitar preflight CORS con Apps Script
// ============================================================
async function api(action, payload) {
  const body = JSON.stringify({ action, token: TOKEN, ...payload });
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body
  });
  return res.json();
}

// ============================================================
// LOGIN
// ============================================================
async function login() {
  const password = document.getElementById('loginPassword').value;
  const errorEl = document.getElementById('loginError');
  errorEl.textContent = '';
  try {
    const res = await api('login', { password });
    if (res.ok) {
      TOKEN = res.token;
      localStorage.setItem('token', TOKEN);
      mostrarApp();
    } else {
      errorEl.textContent = res.error || 'Contraseña incorrecta';
    }
  } catch (e) {
    errorEl.textContent = 'No se pudo conectar con el servidor. Revisa API_URL en app.js.';
  }
}

function logout() {
  TOKEN = null;
  localStorage.removeItem('token');
  document.getElementById('app').classList.add('hidden');
  document.getElementById('loginScreen').classList.remove('hidden');
}

function mostrarApp() {
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  const hoy = new Date();
  document.getElementById('fechaAsistencia').value = fmtDate(hoy);
  document.getElementById('fechaReporte').value = fmtDate(hoy);
  document.getElementById('semanaInput').value = fmtDate(lunesDeEstaSemana(hoy));
  cargarPersonal();
  cargarHorario();
  cargarAsistencia();
  api('getConfig', {}).then(res => { if (res.ok) MINUTOS_ALMUERZO = res.minutosAlmuerzo; });
}

if (TOKEN) mostrarApp();

// ============================================================
// UTILIDADES
// ============================================================
function fmtDate(d) { return d.toISOString().split('T')[0]; }
function lunesDeEstaSemana(d) {
  const date = new Date(d);
  const day = (date.getDay() + 6) % 7;
  date.setDate(date.getDate() - day);
  return date;
}
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.remove('hidden');
  setTimeout(() => t.classList.add('hidden'), 2500);
}
function showTab(tab) {
  document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
  document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.remove('hidden');
  document.querySelector(`.tab-btn[data-tab="${tab}"]`).classList.add('active');
}

// ============================================================
// PERSONAL
// ============================================================
async function cargarPersonal() {
  const res = await api('getPersonal', {});
  if (!res.ok) return toast(res.error || 'Error cargando personal');
  personalCache = res.data;
  renderPersonal();
}

function renderPersonal() {
  const tbody = document.querySelector('#tablaPersonal tbody');
  tbody.innerHTML = '';
  personalCache.forEach(p => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${p.nombre}</td>
      <td>${p.tipo}</td>
      <td>${p.area || ''}</td>
      <td>${p.estado}</td>
      <td><button onclick='editarPersonal(${JSON.stringify(p)})'>Editar</button></td>
    `;
    tbody.appendChild(tr);
  });
}

function abrirFormPersonal() {
  document.getElementById('formPersonal').classList.remove('hidden');
  document.getElementById('pId').value = '';
  document.getElementById('pNombre').value = '';
  document.getElementById('pArea').value = '';
}
function cerrarFormPersonal() {
  document.getElementById('formPersonal').classList.add('hidden');
}
function editarPersonal(p) {
  document.getElementById('formPersonal').classList.remove('hidden');
  document.getElementById('pId').value = p.id;
  document.getElementById('pNombre').value = p.nombre;
  document.getElementById('pTipo').value = p.tipo;
  document.getElementById('pArea').value = p.area;
  document.getElementById('pEstado').value = p.estado;
}
async function guardarPersonal() {
  const persona = {
    id: document.getElementById('pId').value,
    nombre: document.getElementById('pNombre').value,
    tipo: document.getElementById('pTipo').value,
    area: document.getElementById('pArea').value,
    estado: document.getElementById('pEstado').value
  };
  if (!persona.nombre) return toast('Falta el nombre');
  const res = await api('savePersonal', { persona });
  if (res.ok) {
    toast('Guardado');
    cerrarFormPersonal();
    await cargarPersonal();
    // Refresca también Horario y Asistencia para que la nueva persona aparezca ahí de inmediato
    renderHorario();
    cargarAsistencia();
  } else {
    toast(res.error || 'Error');
  }
}

// ============================================================
// HORARIO SEMANAL
// ============================================================
async function cargarHorario() {
  const semana = document.getElementById('semanaInput').value;
  if (!semana) return;
  const res = await api('getHorario', { semana });
  if (!res.ok) return toast(res.error || 'Error cargando horario');
  horarioCache = res.data;
  renderHorario();
}

async function generarHorario() {
  const semana = document.getElementById('semanaInput').value;
  if (!semana) return toast('Selecciona una semana primero');
  const res = await api('generarHorario', { semana });
  if (res.ok) {
    horarioCache = res.data;
    renderHorario();
    toast('Propuesta generada. Revisa y ajusta antes de guardar.');
  } else {
    toast(res.error || 'Error');
  }
}

function renderHorario() {
  if (personalCache.length === 0) return;
  const tbody = document.querySelector('#tablaHorario tbody');
  tbody.innerHTML = '';
  const activos = personalCache.filter(p => p.estado === 'Activo');

  activos.forEach(p => {
    const tr = document.createElement('tr');
    let celdas = `<td>${p.nombre}</td><td>${p.tipo}</td>`;
    DIAS.forEach(dia => {
      const registro = horarioCache.find(h => h.id === p.id && h.dia === dia);
      const turno = registro ? registro.turno : 'Dia';
      celdas += `<td>
        <select class="turno-select" data-turno="${turno}" data-id="${p.id}" data-nombre="${p.nombre.replace(/"/g,'&quot;')}" data-dia="${dia}"
          onchange="this.dataset.turno=this.value">
          <option value="Dia" ${turno === 'Dia' ? 'selected' : ''}>Día</option>
          <option value="Noche" ${turno === 'Noche' ? 'selected' : ''}>Noche</option>
          <option value="Descanso" ${turno === 'Descanso' ? 'selected' : ''}>Descanso</option>
        </select>
      </td>`;
    });
    tr.innerHTML = celdas;
    tbody.appendChild(tr);
  });
}

async function guardarHorario() {
  const semana = document.getElementById('semanaInput').value;
  const filas = [];
  document.querySelectorAll('#tablaHorario select.turno-select').forEach(sel => {
    filas.push({ id: sel.dataset.id, nombre: sel.dataset.nombre, dia: sel.dataset.dia, turno: sel.value });
  });
  const res = await api('guardarHorario', { semana, filas });
  if (res.ok) {
    toast('Horario guardado');
    cargarHorario();
  } else {
    toast(res.error || 'Error');
  }
}

// ============================================================
// ASISTENCIA
// ============================================================
async function cargarAsistencia() {
  const fecha = document.getElementById('fechaAsistencia').value;
  if (!fecha) return;
  const [semana, diaNombre] = semanaYDiaDe(fecha);
  document.getElementById('semanaInput').value; // no-op, mantiene selección de horario aparte

  const resHorario = await api('getHorario', { semana });
  const resAsist = await api('getAsistencia', { fecha });
  if (!resAsist.ok) return toast(resAsist.error || 'Error');

  asistenciaCache = resAsist.data;
  const horarioDia = (resHorario.ok ? resHorario.data : []).filter(h => h.dia === diaNombre);
  renderAsistencia(horarioDia);
}

function semanaYDiaDe(fechaStr) {
  const fecha = new Date(fechaStr + 'T00:00:00');
  const lunes = lunesDeEstaSemana(fecha);
  const diaNombre = DIAS[(fecha.getDay() + 6) % 7];
  return [fmtDate(lunes), diaNombre];
}

const OPCIONES_INGRESO = ['7:30', 'Otro'];
const OPCIONES_SALIDA = ['17:00', '19:30', 'Otro'];

function renderAsistencia(horarioDia) {
  const tbody = document.querySelector('#tablaAsistencia tbody');
  tbody.innerHTML = '';
  const activos = personalCache.filter(p => p.estado === 'Activo');

  activos.forEach(p => {
    const asignado = horarioDia.find(h => h.id === p.id);
    const turno = asignado ? asignado.turno : 'Dia';
    if (turno === 'Descanso') return;
    const marca = asistenciaCache.find(a => a.id === p.id);
    const estado = marca ? marca.estado : 'Sin marcar';

    const nombreSeguro = p.nombre.replace(/'/g, "\\'");
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${p.nombre}</td>
      <td>${p.tipo}</td>
      <td>${turno}</td>
      <td>${renderHoraSelect(p.id, 'ingreso', OPCIONES_INGRESO, marca ? marca.horaIngreso : '')}</td>
      <td>${renderHoraSelect(p.id, 'salida', OPCIONES_SALIDA, marca ? marca.horaSalida : '')}</td>
      <td class="estado-marcar">
        <button class="estado-btn estado-presente ${estado === 'Presente' ? 'active' : ''}" onclick="marcar('${p.id}','${nombreSeguro}','${turno}','Presente')">Presente</button>
        <button class="estado-btn estado-ausente ${estado === 'Ausente' ? 'active' : ''}" onclick="marcar('${p.id}','${nombreSeguro}','${turno}','Ausente')">Ausente</button>
      </td>
    `;
    tbody.appendChild(tr);
  });
}

// Construye el <select> de hora + input oculto para "Otro"
function renderHoraSelect(id, tipo, opciones, valorGuardado) {
  const esPreset = opciones.includes(valorGuardado);
  const seleccion = valorGuardado ? (esPreset ? valorGuardado : 'Otro') : opciones[0];
  const opts = opciones.map(o => `<option value="${o}" ${o === seleccion ? 'selected' : ''}>${o}</option>`).join('');
  const mostrarCustom = seleccion === 'Otro';
  const valorCustom = mostrarCustom && valorGuardado ? valorGuardado : '';
  return `
    <select class="hora-select" id="${tipo}-${id}" onchange="toggleCustom('${id}','${tipo}')">${opts}</select>
    <br>
    <input type="time" class="hora-custom ${mostrarCustom ? '' : 'hidden'}" id="${tipo}-custom-${id}" value="${valorCustom}">
  `;
}

function toggleCustom(id, tipo) {
  const select = document.getElementById(`${tipo}-${id}`);
  const custom = document.getElementById(`${tipo}-custom-${id}`);
  custom.classList.toggle('hidden', select.value !== 'Otro');
}

function getHoraSeleccionada(id, tipo) {
  const select = document.getElementById(`${tipo}-${id}`);
  if (select.value === 'Otro') {
    const custom = document.getElementById(`${tipo}-custom-${id}`);
    return custom.value || '';
  }
  return select.value;
}

async function marcar(id, nombre, turno, estado) {
  const fecha = document.getElementById('fechaAsistencia').value;
  const horaIngreso = estado === 'Presente' ? getHoraSeleccionada(id, 'ingreso') : '';
  const horaSalida = estado === 'Presente' ? getHoraSeleccionada(id, 'salida') : '';
  if (estado === 'Presente' && (!horaIngreso || !horaSalida)) {
    return toast('Completa la hora de ingreso y salida');
  }
  const res = await api('marcarAsistencia', { fecha, id, nombre, turno, estado, horaIngreso, horaSalida });
  if (res.ok) {
    toast(`${nombre}: ${estado}`);
    cargarAsistencia();
  } else {
    toast(res.error || 'Error');
  }
}

// ============================================================
// REPORTES: CSV y PDF
// ============================================================
async function exportarCSV() {
  const fecha = document.getElementById('fechaReporte').value;
  const res = await api('getAsistencia', { fecha });
  if (!res.ok || res.data.length === 0) return toast('No hay datos de asistencia para esa fecha');

  let csv = 'Nombre,Turno,Estado,Ingreso,Salida,Horas trabajadas,Observaciones\n';
  res.data.forEach(a => {
    const horasTrabajadas = calcularHorasTrabajadas(a.horaIngreso, a.horaSalida);
    csv += `"${a.nombre}","${a.turno}","${a.estado}","${a.horaIngreso || ''}","${a.horaSalida || ''}","${horasTrabajadas}","${a.obs || ''}"\n`;
  });
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = `asistencia_${fecha}.csv`;
  link.click();
}

async function exportarPDF() {
  const fecha = document.getElementById('fechaReporte').value;
  const res = await api('getAsistencia', { fecha });
  if (!res.ok || res.data.length === 0) return toast('No hay datos de asistencia para esa fecha');

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  doc.setFontSize(14);
  doc.text(`Reporte de asistencia - ${fecha}`, 14, 16);

  const filas = res.data.map(a => [a.nombre, a.turno, a.estado, a.horaIngreso || '-', a.horaSalida || '-', calcularHorasTrabajadas(a.horaIngreso, a.horaSalida) || '-', a.obs || '']);
  doc.autoTable({
    startY: 22,
    head: [['Nombre', 'Turno', 'Estado', 'Ingreso', 'Salida', 'Horas trabajadas', 'Observaciones']],
    body: filas
  });

  doc.save(`asistencia_${fecha}.pdf`);
}
